---
openapi: 3.0.3
info:
  title: aws-accounts-api
  description: |
    Manage AWS accounts in environment using AWS Control Tower Service Catalog product
  version: 1.0.0
servers:
  - url:
      Fn::Sub: "https://${Hostname}"
    description: Production endpoint
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
x-amazon-apigateway-request-validator: "all"

paths:
  "/health":
    get:
      summary: Health check
      description: Get health of endpoint
      parameters:
        - $ref: "#/components/parameters/headerContentTypeJson"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
      security:
        - serverlessOpsCognitoPool:
          - Fn::Sub: https://${Hostname}/health.read
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          "application/json": |
            {
              "statusCode": 200
            }
        responses:
          "200":
            statusCode: 200
            responseTemplates:
              "application/json": |
                {
                  "healthy": true
                }

  "/v1/account":
    post:
      summary: Start CreateAccount
      description: Start an execution of the CreateAccount state machine
      parameters:
        - $ref: "#/components/parameters/headerContentTypeJson"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionInput"
      responses:
        '201':
          description: Account creation request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartExecutionResponse"
        '400':
          description: Client failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - serverlessOpsCognitoPool:
          - Fn::Sub: https://${Hostname}/account.write
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:states:action/StartExecution"
        credentials:
          Fn::GetAtt: [RestApiIamRole, Arn]
        passthroughBehavior: never
        requestTemplates:
          "application/json":
            Fn::Sub: |
              {
                "input": "$util.escapeJavaScript($input.json('$')).replaceAll("\\'", "'")",
                "stateMachineArn": "${CreateAccountStateMachine}"
              }
        responses:
          "4\\d{2}":
            statusCode: 400
            responseTemplates:
              "application/json": |
                {
                  "name": "$util.escapeJavaScript($input.path('$.__type'))",
                  "message": "$util.escapeJavaScript($input.path('$.message'))"
                }
          "5\\d{2}":
            statusCode: 500
            responseTemplates:
              "application/json": |
                {
                  "name": "InternalServerError",
                  "message": "Failed to start the state machine execution"
                }
          default:
            statusCode: 201
            responseTemplates:
              "application/json": |
                {
                  "txn_id": "$input.path('$.executionArn')"
                }

  "/transactions":
    get:
      summary: Get transaction status and progress
      description: Returns transaction status and the latest 100 progress events, newest first.
      parameters:
        - name: txn_id
          in: query
          required: true
          schema:
            type: string
          description: Transaction ID returned by POST /v1/account.
      responses:
        '200':
          description: Transaction status and progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        '400':
          description: Invalid transaction ID
        '500':
          description: Unable to retrieve transaction
      security:
        - serverlessOpsCognitoPool:
          - Fn::Sub: https://${Hostname}/account.read
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:states:action/GetExecutionHistory"
        credentials:
          Fn::GetAtt: [RestApiIamRole, Arn]
        passthroughBehavior: never
        requestTemplates:
          application/json: |
            {
              "executionArn": "$util.escapeJavaScript($input.params('txn_id')).replaceAll("\\'", "'")",
              "reverseOrder": true,
              "maxResults": 100,
              "includeExecutionData": false
            }
        responses:
          "4\\d{2}":
            statusCode: 400
            responseTemplates:
              application/json: '{"message": "Invalid transaction ID"}'
          "5\\d{2}":
            statusCode: 500
            responseTemplates:
              application/json: '{"message": "Unable to retrieve transaction"}'
          default:
            statusCode: 200
            responseTemplates:
              application/json: |
                #set($status = "RUNNING")
                #set($lifecycleFound = false)
                #foreach($event in $input.path('$.events'))
                  #if(!$lifecycleFound && $event.type.startsWith("Execution"))
                    #set($lifecycleFound = true)
                    #if($event.type == "ExecutionSucceeded")
                      #set($status = "SUCCEEDED")
                    #elseif($event.type == "ExecutionFailed")
                      #set($status = "FAILED")
                    #elseif($event.type == "ExecutionTimedOut")
                      #set($status = "TIMED_OUT")
                    #elseif($event.type == "ExecutionAborted")
                      #set($status = "ABORTED")
                    #end
                  #end
                #end
                {
                  "txn_id": "$util.escapeJavaScript($input.params('txn_id')).replaceAll("\\'", "'")",
                  "status": "$status",
                  "progress": $input.json('$.events')
                }

components:
  schemas:
    ExecutionInput:
      type: object
      description: Account Factory account request
      required:
        - account_name
        - ou_name
      properties:
        account_name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
          description: Account name used in admin+<account_name>@serverlessops.io.
        ou_name:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    StartExecutionResponse:
      type: object
      properties:
        txn_id:
          type: string
      required:
        - txn_id
    TransactionResponse:
      type: object
      required:
        - txn_id
        - status
        - progress
      properties:
        txn_id:
          type: string
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED, TIMED_OUT, ABORTED]
        progress:
          type: array
          items:
            type: object
          description: Step Functions history events, including the current workflow step.
    ErrorResponse:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
      required:
        - message
    HealthCheckResponse:
      type: object
      properties:
        healthy:
          type: boolean
      required:
        - healthy
  parameters:
    headerContentTypeJson:
      name: Content-Type
      in: header
      schema:
        type: string
        default: application/json; charset=utf-8
  securitySchemes:
    serverlessOpsCognitoPool:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: COGNITO_USER_POOLS
      x-amazon-apigateway-authorizer:
        type: COGNITO_USER_POOLS
        providerARNs:
          - Ref: CognitoUserPoolArn
        identitySource: method.request.header.Authorization
